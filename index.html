<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Roboto', Arial, sans-serif;
    margin: 0;
    background: #0d0d0d;
    color: #e0e0e0;
  }
  .toolbar {
    background: #607d8b;
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    font-size: 1.2rem;
    font-weight: 500;
  }
  .toolbar .logo { margin-right: 10px; font-size: 1.4rem; }
  .toolbar .spacer { flex: 1; }
  .toolbar .icons { display: flex; gap: 24px; font-size: 0.9rem; opacity: 0.9; }

  .container {
    max-width: 560px;
    margin: 60px auto;
    background: #424242;
    border-radius: 6px;
    padding: 36px 40px;
  }
  h1 { font-size: 1.8rem; font-weight: 700; margin: 0 0 28px; color: #f5f5f5; }

  .field { margin-bottom: 24px; }
  .field input {
    width: 100%;
    padding: 16px 14px;
    font-size: 1rem;
    border: 1px solid #6b6b6b;
    border-radius: 2px;
    background: #4a4a4a;
    color: #e0e0e0;
  }
  .field input::placeholder { color: #bdbdbd; }
  .field input:focus { outline: none; border-color: #90a4ae; }

  .pw-wrap { position: relative; }
  .pw-wrap .eye {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: #bdbdbd; cursor: pointer; font-size: 1.1rem; user-select: none;
  }

  .forgot { font-size: 0.85rem; margin-bottom: 20px; }
  .forgot a { color: #76ff03; text-decoration: none; }

  button.primary {
    width: 100%;
    padding: 13px;
    background: #78909c;
    color: #e0e0e0;
    border: none;
    border-radius: 24px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    opacity: 0.85;
  }
  button.primary:hover { opacity: 1; }

  .remember { display: flex; align-items: center; justify-content: center; font-size: 0.9rem; margin: 18px 0; }
  .remember input { margin-right: 8px; }

  .divider { display: flex; align-items: center; margin: 20px 0; color: #9e9e9e; font-size: 0.85rem; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #6b6b6b; }
  .divider span { padding: 0 12px; }

  .google-btn {
    width: 100%;
    padding: 12px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .google-btn .g-icon { font-weight: 700; }

  .signup { text-align: center; margin-top: 22px; font-size: 0.85rem; }
  .signup a { color: #76ff03; text-decoration: none; }

  #message { margin-top: 14px; font-size: 0.85rem; text-align: center; }
  .error { color: #ef5350; }
  .success { color: #66bb6a; }
</style>
</head>
<body>
  <div class="toolbar">
    OWASP Juice Shop
    <span class="spacer"></span>
    <span class="icons">Account &nbsp; Your Basket &nbsp; EN</span>
  </div>

  <div class="container">
    <h1>Login</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <input type="email" id="email" placeholder="Email*" autocomplete="username">
      </div>
      <div class="field pw-wrap">
        <input type="password" id="password" placeholder="Password*" autocomplete="current-password">
        <span class="eye" onclick="togglePassword()">show</span>
      </div>
      <div class="forgot"><a href="#">Forgot your password?</a></div>

      <button type="submit" class="primary">Log in</button>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
      </div>

      <div class="divider"><span>or</span></div>

      <button type="button" class="google-btn"><span class="g-icon">G</span> Log in with Google</button>
    </form>
    <p id="message"></p>
    <div class="signup"><a href="#">Not yet a customer?</a></div>
  </div>

  <script src="script.js"></script>
  <script>
    function togglePassword() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
